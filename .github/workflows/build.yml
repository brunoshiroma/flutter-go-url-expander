name: build-android

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: build android
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - run: flutter pub get
      - name: test project
        run: flutter test
      - run: flutter build ios --release --no-codesign
      - run: flutter build apk